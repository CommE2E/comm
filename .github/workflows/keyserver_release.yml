name: Build keyserver Docker image and upload to Docker Hub

on:
  push:
    tags:
      - keyserver-**

env:
  IMAGE_NAME: commapp/keyserver

jobs:
  prepare:
    runs-on: ubuntu-24.04

    outputs:
      image_tag: ${{ steps.keyserver_code_version.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Determine current keyserverCodeVersion
        id: keyserver_code_version
        run: |
          patch_version=$(
            grep keyserverCodeVersion keyserver/src/version.js |
              sed -r 's/^[^0-9]*([0-9]+);$/\1/g'
          )
          if [[ -z "$patch_version" ]]; then
            echo "Could not determine keyserverCodeVersion" >&2
            exit 1
          fi
          echo "image_tag=${IMAGE_NAME}:1.0.${patch_version}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            artifact_name: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact_name: linux-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./keyserver/Dockerfile
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          platforms: ${{ matrix.platform }}
          provenance: false
          build-args: |
            HOST_GID=20
            HOST_UID=501
            COMM_JSONCONFIG_secrets_alchemy={"key":"${{secrets.ALCHEMY_API_KEY}}"}
            COMM_JSONCONFIG_secrets_walletconnect={"key":"${{secrets.WALLETCONNECT_API_KEY}}"}
            COMM_JSONCONFIG_secrets_neynar={"key":"${{secrets.NEYNAR_API_KEY}}"}
            COMM_JSONCONFIG_secrets_geoip_license={"key":"${{secrets.GEOIP_LICENSE}}"}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          if [[ -z "$digest" ]]; then
            echo "Build did not return a digest" >&2
            exit 1
          fi
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.artifact_name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push manifest list
        shell: bash
        working-directory: /tmp/digests
        run: |
          shopt -s nullglob
          digests=(*)
          if [[ ${#digests[@]} -eq 0 ]]; then
            echo "No digests were downloaded" >&2
            exit 1
          fi

          sources=()
          for digest in "${digests[@]}"; do
            sources+=("${IMAGE_NAME}@sha256:${digest}")
          done

          docker buildx imagetools create \
            --tag "${{ needs.prepare.outputs.image_tag }}" \
            "${sources[@]}"

      - name: Inspect manifest list
        run: |
          docker buildx imagetools inspect \
            "${{ needs.prepare.outputs.image_tag }}"
